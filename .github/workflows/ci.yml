name: CI

on:
  push:
  pull_request:

jobs:
  desktop-linux:
    name: Desktop layouts (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xkb tooling
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-tools xkb-data
      - name: Generate the layouts
        run: ./scripts/build-desktop.sh
      - name: Check the generated files against src/
        run: python3 scripts/verify-desktop.py
      - name: Install each XKB layout and type the whole alphabet on it
        run: ./scripts/verify-xkb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  desktop-macos:
    name: Desktop layouts (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the layouts
        run: ./scripts/build-desktop.sh
      # On macOS this also validates the bundle against Apple's KeyboardLayout.dtd.
      - name: Check the generated files against src/
        run: python3 scripts/verify-desktop.py
      - name: Check the bundle is installable
        run: |
          ./dist/macos/install.sh
          test -f "$HOME/Library/Keyboard Layouts/Uzbek2026.bundle/Contents/Info.plist"
          plutil -lint "$HOME/Library/Keyboard Layouts/Uzbek2026.bundle/Contents/Info.plist"
          ./dist/macos/uninstall.sh

  desktop-windows:
    name: Windows layout files
    needs: desktop-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # MSKLC is a GUI installer and cannot run here, so what Windows can check is that
      # the .klc files it would be given are intact: right encoding, right sections, and
      # the same key map as src/.
      - name: Check the .klc files parse on Windows
        run: python scripts/verify-desktop.py

  android:
    name: Android keyboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
        working-directory: android
      - name: Build the APK
        run: ./gradlew :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  android-emulator:
    name: Android keyboard on an emulator
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Taps the keys where they are drawn and reads back what landed in the text field.
      - name: Type the alphabet on a running emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            python3 android/scripts/device-test.py

  ios:
    name: iOS keyboard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
        working-directory: ios
      - name: Unit and UI tests in the simulator
        run: |
          DEVICE=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for v in d.values() for x in v if 'iPhone' in x['name']))")
          xcodebuild -project UzbekKeyboard.xcodeproj -scheme UzbekKeyboard \
            -destination "id=$DEVICE" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO test
        working-directory: ios
